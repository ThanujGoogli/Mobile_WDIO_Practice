
name: Android Mobile Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Node.js
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 5. Launch Android Emulator and execute tests
      - name: Run Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true

          script: |
            adb devices
            npx wdio run config/wdio.android.conf.js

      # 6. Upload logs
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logs
          path: |
            logs/
            screenshots/
          if-no-files-found: ignore